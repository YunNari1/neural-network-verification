# alpha-beta-CROWN verification configuration
# Model: MNIST MLP (784->64->32->10, ReLU)
# Property: L-inf robustness with epsilon=0.01
# Matches the property verified in Assignment 3 (Marabou) for comparison.

model:
  onnx_path: models/mnist_mlp.onnx
  input_shape: [1, 784]

data:
  dataset: MNIST
  mean: [0.0]
  std: [1.0]
  start: 0
  end: 100

specification:
  epsilon: 0.01
  norm: .inf

solver:
  batch_size: 256
  beta-crown:
    iteration: 20
    lr_alpha: 0.1

bab:
  timeout: 60
  branching:
    method: kfsb
    candidates: 3
    reduce_op: min
  attack:
    enabled: false
